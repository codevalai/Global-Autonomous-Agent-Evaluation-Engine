name: GAEE Enterprise CI/CD & Multi-Region Deployment

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  verify-frontend-control-plane:
    name: TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  verify-python-evaluation-engine:
    name: Python 3.12 Distributed Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python Engine Modules
        run: python -m py_compile backend_engine/*.py
